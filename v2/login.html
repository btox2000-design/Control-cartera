<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Cartera</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 25px;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fafbfc;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .toggle-link {
            display: block;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
        }
        #message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        #message-box.error {
            background-color: #fce8e6;
            color: var(--danger-color);
            display: block;
        }
        #message-box.success {
            background-color: #e6fced;
            color: var(--success-color);
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 id="form-title">Iniciar Sesión</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">CORREO ELECTRÓNICO</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" id="submit-btn" class="btn-submit">Ingresar</button>
            </form>
            <div id="message-box"></div>
            <a href="#" id="toggle-auth-btn" class="toggle-link">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>

    <script type="module">
        console.log("¡EJECUCIÓN BÁSICA: EL SCRIPT ESTÁ CARGANDO!");
        alert("Script cargado y ejecutándose");
        
        // Desactivado temporalmente para diagnosticar:
        // import { supabase } from '/src/supabaseClient.js';
    </script>
</body>
</html>
