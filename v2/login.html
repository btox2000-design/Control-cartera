<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Cartera</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 25px;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fafbfc;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .toggle-link {
            display: block;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
        }
        #message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        #message-box.error {
            background-color: #fce8e6;
            color: var(--danger-color);
            display: block;
        }
        #message-box.success {
            background-color: #e6fced;
            color: var(--success-color);
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 id="form-title">Iniciar Sesión</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">CORREO ELECTRÓNICO</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" id="submit-btn" class="btn-submit">Ingresar</button>
            </form>
            <div id="message-box"></div>
            <a href="#" id="toggle-auth-btn" class="toggle-link">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>

    <script type="module">
        console.log("DEBUG: Iniciando carga de script en login.html");
        
        // Forzar visibilidad por si acaso
        const container = document.querySelector('.login-container');
        if (container) {
            container.style.display = 'flex';
            console.log("DEBUG: Contenedor login forzado a display: flex");
        } else {
            console.error("DEBUG: No se encontró .login-container");
        }

        import { supabase } from '/src/supabaseClient.js';
        
        let isLoginMode = true;
        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleAuthBtn = document.getElementById('toggle-auth-btn');
        const messageBox = document.getElementById('message-box');

        toggleAuthBtn.onclick = (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            formTitle.textContent = isLoginMode ? 'Iniciar Sesión' : 'Crear Cuenta';
            submitBtn.textContent = isLoginMode ? 'Ingresar' : 'Registrarse';
            toggleAuthBtn.textContent = isLoginMode ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia sesión';
            messageBox.style.display = 'none';
        };

        authForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            messageBox.className = '';
            messageBox.style.display = 'none';

            try {
                if (isLoginMode) {
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    window.location.href = '/index.html';
                } else {
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    messageBox.className = 'success';
                    messageBox.textContent = '¡Registro exitoso! Verifica tu correo electrónico para confirmar la cuenta.';
                }
            } catch (err) {
                messageBox.className = 'error';
                messageBox.textContent = err.message || 'Ocurrió un error inesperado';
                messageBox.style.display = 'block';
            }
        };

        // Redirección si ya está logueado
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) window.location.href = '/index.html';
        });
    </script>
</body>
</html>
